# Keep the default tmux prefix only as a fallback.
set -g prefix C-b

# Terminal behavior
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g escape-time 10
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Mouse: select panes, resize panes, switch windows
set -g mouse on

# Window mode: press Option-t, then use one-key tab/window actions.
bind -n M-t switch-client -T tab-mode
bind -T tab-mode n new-window -c "#{pane_current_path}"
bind -T tab-mode h previous-window \; switch-client -T tab-mode
bind -T tab-mode [ previous-window \; switch-client -T tab-mode
bind -T tab-mode l next-window \; switch-client -T tab-mode
bind -T tab-mode ] next-window \; switch-client -T tab-mode
bind -T tab-mode r command-prompt -I "#{window_name}" "rename-window '%%'"
bind -T tab-mode q kill-window
bind -T tab-mode 1 select-window -t 1 \; switch-client -T tab-mode
bind -T tab-mode 2 select-window -t 2 \; switch-client -T tab-mode
bind -T tab-mode 3 select-window -t 3 \; switch-client -T tab-mode
bind -T tab-mode 4 select-window -t 4 \; switch-client -T tab-mode
bind -T tab-mode 5 select-window -t 5 \; switch-client -T tab-mode
bind -T tab-mode 6 select-window -t 6 \; switch-client -T tab-mode
bind -T tab-mode 7 select-window -t 7 \; switch-client -T tab-mode
bind -T tab-mode 8 select-window -t 8 \; switch-client -T tab-mode
bind -T tab-mode 9 select-window -t 9 \; switch-client -T tab-mode
bind -T tab-mode Escape send-keys -N 0

# Split mode: press Option-s, then split or close panes.
bind -n M-s switch-client -T split-mode
bind -T split-mode v split-window -h -c "#{pane_current_path}"
bind -T split-mode | split-window -h -c "#{pane_current_path}"
bind -T split-mode s split-window -v -c "#{pane_current_path}"
bind -T split-mode - split-window -v -c "#{pane_current_path}"
bind -T split-mode w kill-pane
bind -T split-mode Escape send-keys -N 0
unbind '"'
unbind %

# Pane mode: press Option-p, then use vim keys without modifiers.
bind -n M-p switch-client -T pane-mode
bind -T pane-mode h select-pane -L \; switch-client -T pane-mode
bind -T pane-mode j select-pane -D \; switch-client -T pane-mode
bind -T pane-mode k select-pane -U \; switch-client -T pane-mode
bind -T pane-mode l select-pane -R \; switch-client -T pane-mode
bind -T pane-mode H resize-pane -L 5 \; switch-client -T pane-mode
bind -T pane-mode J resize-pane -D 3 \; switch-client -T pane-mode
bind -T pane-mode K resize-pane -U 3 \; switch-client -T pane-mode
bind -T pane-mode L resize-pane -R 5 \; switch-client -T pane-mode
bind -T pane-mode w kill-pane
bind -T pane-mode q send-keys -N 0
bind -T pane-mode Escape send-keys -N 0

# Quick config reload
bind -n M-R source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Copy mode: vi keys
setw -g mode-keys vi
bind -n M-e copy-mode

# Visual style
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify right
set -g status-style "bg=#{?#{==:#{client_key_table},tab-mode},#b4befe,#{?#{==:#{client_key_table},split-mode},#fab387,#{?#{==:#{client_key_table},pane-mode},#a6e3a1,#11111b}}},fg=#{?#{==:#{client_key_table},tab-mode},#11111b,#{?#{==:#{client_key_table},split-mode},#11111b,#{?#{==:#{client_key_table},pane-mode},#11111b,#cdd6f4}}}"
set -g window-status-separator ""
set -g window-status-format " #[fg=#6c7086]#I #[fg=#a6adc8]#W "
set -g window-status-current-format " #[bg=#89b4fa,fg=#11111b,bold] #I #[bg=#89b4fa,fg=#11111b,bold]#W "
set -g status-left-length 180
set -g status-left "#[bold] #S #[bg=#{?#{==:#{client_key_table},tab-mode},#11111b,#{?#{==:#{client_key_table},split-mode},#11111b,#{?#{==:#{client_key_table},pane-mode},#11111b,#313244}}},fg=#{?#{==:#{client_key_table},tab-mode},#b4befe,#{?#{==:#{client_key_table},split-mode},#fab387,#{?#{==:#{client_key_table},pane-mode},#a6e3a1,#cdd6f4}}},bold] #{?#{==:#{client_key_table},tab-mode},TAB n:new h/l:prev/next 1-9:jump r:rename q:close Esc:exit,#{?#{==:#{client_key_table},split-mode},SPLIT v:right s:down w:close Esc:exit,#{?#{==:#{client_key_table},pane-mode},PANE h/j/k/l:focus H/J/K/L:resize w:close q/Esc:exit,NORMAL Opt-t:tabs Opt-s:splits Opt-p:panes}}} #[default]"
set -g status-right "#[fg=#6c7086] #{pane_current_path} #[fg=#89b4fa,bold]%H:%M "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines single
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#6c7086"
set -g message-style "bg=#313244,fg=#cdd6f4,bold"
set -g message-command-style "bg=#313244,fg=#f9e2af,bold"
set -g mode-style "bg=#89b4fa,fg=#11111b,bold"
